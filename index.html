<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>GMDigiCorp | MD GOLAM MOSTOFA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root {
  --bg: #050814;
  --accent: #00e5ff;
  --accent2: #7b5cff;
  --text: #e5f4ff;
  --muted: #8fa3c7;
  --font-main: "Segoe UI", system-ui, sans-serif;
}

/* Base */
body {
  margin: 0;
  padding: 0;
  font-family: var(--font-main);
  background: radial-gradient(circle at top, #0b1633 0, #02030a 40%, #000000 100%);
  color: var(--text);
  overflow-x: hidden;
}

/* Background Grid */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image: linear-gradient(rgba(0, 229, 255, 0.08) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0, 229, 255, 0.08) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.35;
  animation: gridMove 18s linear infinite;
  z-index: -2;
}
@keyframes gridMove {
  0% { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-80px,-80px,0); }
}

/* Glow */
.bg-glow {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 20% 0%, rgba(0,229,255,0.25), transparent 55%),
              radial-gradient(circle at 80% 100%, rgba(0,229,255,0.18), transparent 55%);
  mix-blend-mode: screen;
  z-index: -1;
}

/* Center Intro */
.intro {
  height: 100vh;
  max-width: 900px;
  margin: auto;
  padding: 2rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  animation: fadeIn 1.2s ease forwards;
}

/* Name Highlight */
.intro-title {
  font-size: 4.5rem;
  font-weight: 900;
  letter-spacing: 0.05em;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
  -webkit-background-clip: text;
  color: transparent;
  margin-bottom: 1rem;
  text-transform: uppercase;
  animation: glowPulse 4s ease-in-out infinite;
}

/* Tagline */
.tagline {
  font-size: 1.4rem;
  color: var(--accent);
  margin-bottom: 1.5rem;
  animation: fadeUp 1.8s ease forwards;
}

/* Subtitle */
.intro-sub {
  font-size: 1.1rem;
  color: var(--muted);
  margin-bottom: 2rem;
  line-height: 1.6;
  animation: fadeUp 2.2s ease forwards;
}

/* Founder Photo */
.photo-box {
  width: 180px;
  height: 180px;
  margin: 0 auto 2rem;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid rgba(0,229,255,0.4);
  box-shadow: 0 0 25px rgba(0,229,255,0.5);
  animation: scaleIn 1.5s ease forwards;
}
.photo-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Social Icons */
.social {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-bottom: 2rem;
  animation: fadeUp 2.5s ease forwards;
}
.social a {
  color: var(--accent);
  font-size: 1.4rem;
  text-decoration: none;
  transition: 0.3s;
}
.social a:hover {
  color: var(--accent2);
  transform: translateY(-3px);
}

/* Button */
.btn-primary {
  background: radial-gradient(circle at 0 0, var(--accent), var(--accent2));
  padding: 0.9rem 2.2rem;
  border-radius: 999px;
  color: var(--text);
  font-size: 1rem;
  border: none;
  cursor: pointer;
  box-shadow: 0 0 18px rgba(0, 229, 255, 0.55);
  transition: 0.25s;
  animation: fadeUp 2.8s ease forwards;
}
.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 25px rgba(0, 229, 255, 0.75);
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes glowPulse {
  0% { text-shadow: 0 0 15px rgba(0,229,255,0.4); }
  50% { text-shadow: 0 0 35px rgba(0,229,255,0.9); }
  100% { text-shadow: 0 0 15px rgba(0,229,255,0.4); }
}
</style>
</head>

<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<section class="intro">

  <div class="photo-box">
    <img src="founder.png" alt="MD GOLAM MOSTOFA">
  </div>

  <h1 class="intro-title">MD GOLAM MOSTOFA</h1>

  <div class="tagline">Future-Ready IT Support Engineer</div>

  <p class="intro-sub">
    Founder of <strong>GMDigiCorp</strong><br>
    Delivering enterprise-grade IT support across UAE & India.<br>
    Microsoft 365 · Active Directory · Intune · SCCM · End-User Computing
  </p>

  <div class="social">
    <a href="https://linkedin.com/in/iammostofaaims" target="_blank">🔗</a>
    <a href="mailto:golammostofa239@gmail.com">✉️</a>
    <a href="tel:+971522230991">📞</a>
  </div>

  <button class="btn-primary" onclick="location.href='founder.html'">
    Meet the Founder
  </button>

</section>

</body>
</html>
